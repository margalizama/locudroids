name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --console=plain > build.log 2>&1
          code=$?
          cat build.log | tail -n 80
          if [ $code -ne 0 ]; then
            # Resume los errores en una anotación para verlos sin abrir el log completo.
            errs=$(grep -E '^e: |error:|What went wrong|^> |FAILURE|Could not|FAILED|AssertionError|expected:' build.log | head -60)
            errs="${errs//'%'/'%25'}"
            errs="${errs//$'\n'/'%0A'}"
            echo "::error title=Errores de compilacion::$errs"
          fi
          exit $code

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: locudroids-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
